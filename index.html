<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alzz Store</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:20px}
h1{color:#ff0000;font-size:32px;margin-bottom:5px}
.card{background:#111;border:1px solid #333;border-radius:10px;padding:15px;margin:10px 0;cursor:pointer}
.card:active{background:#1a1a1a}
.tag{background:#ff0000;font-size:11px;padding:3px 8px;border-radius:5px;display:inline-block;margin-bottom:5px}
.title{font-weight:bold;font-size:16px;margin:5px 0}
.price{color:#00ff88;font-size:18px;font-weight:bold}
.desc{color:#aaa;font-size:12px;margin-top:5px}
.divider{height:1px;background:#333;margin:15px 0}
</style>
</head>
<body>
<h1>ALZZ STORE</h1>
<p style="color:#888">Jasa Banned - Unbanned - Tools</p>
<div id="all">Loading...</div>
<p style="color:#555;font-size:12px;margin-top:30px">© 2026 Alzz Store | @alzzisback</p>

<script>
const WHATSAPP = "6289525437196"

let products = [
{"name":"JASA BANNED WA","price":"25K"},
{"divider":true},
{"type":"JASA UNBANNED WA","name":"SPAM TINJAU","price":"12K"},
{"type":"JASA UNBANNED WA","name":"PERMA NEW","price":"20K"},
{"type":"JASA UNBANNED WA","name":"PERMA HARD","price":"25K"},
{"type":"JASA UNBANNED WA","name":"PERMA BATU","price":"30K"},
{"type":"JASA UNBANNED WA","name":"PERMA LUMUT","price":"25K"},
{"type":"JASA UNBANNED WA","name":"PERMA LUMUT+BATU+HARD","price":"85K"},
{"divider":true},
{"name":"RESET OTP ALL SOSMED","price":"5K"},
{"divider":true},
{"name":"MURBANNED WA","price":"20K","desc":"FULL PENGAJARAN BENEFIT BANYAK UDAH FIX BALMOD UDAH BISA BUKA JASA BA WA"},
{"divider":true},
{"name":"MURUNBANNED WA","price":"35K","desc":"FULL PENGAJARAN BENEFIT BANYAK BISA BUKA JASA UN WA FIX BALMOD"},
{"divider":true},
{"name":"MURID DDOS VIA TERMUX+TELE","price":"10K"},
{"name":"MURTAG TELE","price":"20K"},
{"divider":true},
{"name":"JASA BUAT WEBSITE PRODUK","price":"20K","desc":"UNTUK TAMPILAN WEBSITE SEPERTI INI"}
]

function renderAll(){
let html = ""
products.forEach(p => {
if(p.divider) html += '<div class="divider"></div>'
else html += `<div class="card" onclick="window.open('https://wa.me/${WHATSAPP}?text=Halo mau order ${p.name}','_blank')">
${p.type?`<div class="tag">${p.type}</div>`:''}
<div class="title">${p.name}</div>
<div class="price">${p.price}</div>
${p.desc?`<div class="desc">${p.desc}</div>`:''}
</div>`
})
document.getElementById('all').innerHTML = html
}

renderAll()
</script>
</body>
</html>

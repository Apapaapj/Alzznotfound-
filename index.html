<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alzz Store</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#0a0a0a;color:#fff}
  .container{max-width:600px;margin:0 auto;padding:20px}
  .header{text-align:center;padding:30px 0;border-bottom:1px solid #333}
  .header h1{font-size:28px;color:#ff0000;margin-bottom:5px}
  .header p{color:#888;font-size:14px}
  #all{display:grid;gap:12px;margin-top:20px}
  .card{background:#111;border:1px solid #222;border-radius:12px;padding:15px;cursor:pointer;transition:0.2s}
  .card:active{transform:scale(0.98);background:#1a1a1a}
  .tag{display:inline-block;background:#ff0000;color:#fff;font-size:10px;padding:3px 8px;border-radius:6px;margin-bottom:8px;font-weight:bold}
  .title{font-size:16px;font-weight:bold;margin-bottom:5px}
  .price{color:#00ff88;font-size:18px;font-weight:bold}
  .desc{color:#aaa;font-size:12px;margin-top:6px;line-height:1.4}
  .divider{height:1px;background:#333;margin:20px 0}
  .footer{text-align:center;padding:30px 0;color:#555;font-size:12px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>ALZZ STORE</h1>
    <p>Jasa Banned - Unbanned - Tools</p>
  </div>
  <div id="all"><p style="text-align:center;color:#666">Loading produk...</p></div>
  <div class="footer">© 2026 Alzz Store | Contact: @alzzisback</div>
</div>

<script>
const WHATSAPP_NUMBER = "6289525437196"
const TELEGRAM = "alzzisback"

let products = []

function renderAll(){
  const all = document.getElementById('all')
  all.innerHTML = ''
  products.forEach(p => {
    if(p.divider){
      all.innerHTML += '<div class="divider"></div>'
      return
    }
    all.innerHTML += `
      <div class="card" onclick="openWA('${p.name.replace(/'/g,"\\'")}')">
        ${p.type ? `<div class="tag">${p.type}</div>` : ''}
        <div class="title">${p.name}</div>
        <div class="price">${p.price}</div>
        ${p.desc ? `<div class="desc">${p.desc}</div>` : ''}
      </div>
    `
  })
}

function openWA(nama){
  const msg = encodeURIComponent(`Halo Alzz, mau order ${nama}`)
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, '_blank')
}

// LOAD PRODUK DARI JSON - TARO PALING BAWAH
fetch('products.json')
  .then(res => {
    if(!res.ok) throw new Error('HTTP '+res.status)
    return res.json()
  })
  .then(data => {
    products = data
    renderAll()
  })
  .catch(err => {
    document.getElementById('all').innerHTML = '<p style="color:#ff0000;text-align:center">Gagal load produk.json<br>Error: '+err.message+'</p>'
    console.error(err)
  })
</script>
</body>
</html>

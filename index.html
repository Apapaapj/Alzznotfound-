<script>
function enterSite(){
  const sound = document.getElementById('slashSound')
  sound.volume = 0.5
  sound.currentTime = 0
  sound.play().catch(e=>console.log('Audio blocked:',e))
  
  document.getElementById('landing').classList.add('hide')
  setTimeout(()=>{
    document.getElementById('landing').style.display='none'
    document.getElementById('main').classList.add('show')
    createBloodRain()
  },1000)
}

function createBloodRain(){
  const container = document.getElementById('bloodRain')
  for(let i=0;i<50;i++){
    const drop = document.createElement('div')
    drop.className = 'blood'
    drop.style.left = Math.random()*100 + '%'
    drop.style.animationDuration = 3 + Math.random()*5 + 's'
    drop.style.animationDelay = Math.random()*5 + 's'
    container.appendChild(drop)
  }
}

function orderAlert(nama, harga){
  alert(`⚔️ GAS ORDER LANGSUNG KE TELE/WA ALZZ AJA DERR ⚔️\n\nProduk: ${nama}\nHarga: ${harga}`)
}

function openTab(tabName,event){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'))
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'))
  document.getElementById(tabName).classList.add('active')
  event.target.classList.add('active')
}
